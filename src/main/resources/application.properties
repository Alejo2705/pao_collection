spring.application.name=sistema-pedidos-ai

spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:pedidos_ai}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}

openai.model=${OPENAI_MODEL:gpt-5.6-luna}

instagram.graph-version=${INSTAGRAM_GRAPH_VERSION:v26.0}
instagram.verify-token=${INSTAGRAM_VERIFY_TOKEN:}
instagram.access-token=${INSTAGRAM_ACCESS_TOKEN:}
instagram.user-id=${INSTAGRAM_USER_ID:}
instagram.app-secret=${INSTAGRAM_APP_SECRET:}

server.port=${PORT:8080}
